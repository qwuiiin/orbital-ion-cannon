[technology-name]
orbital-ion-cannon=Orbital ion cannon
auto-targeting=Ion cannon auto-targeting

[technology-description]
orbital-ion-cannon=Put ion cannons into orbit and clear vast swaths of hostile territory from above. Every cannon you launch shortens the wait between blasts.
auto-targeting=Radars designate enemy nests for your ion cannons while they scan, and new nests inside always-visible radar coverage get hit as they appear.

