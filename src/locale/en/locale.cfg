[mod-setting-description]
ion-cannon-radius=Radius of one blast in tiles.
ion-cannon-laser-damage=Laser damage dealt by one blast.
ion-cannon-explosion-damage=Explosion damage dealt by one blast.
ion-cannon-flames=Blasts set everything in the radius on fire, which can spread into wildfires. When off, the damage covers the whole radius and only trees burn.
ion-cannon-cooldown-seconds=How long each cannon needs before it can fire again. A freshly launched cannon starts on cooldown.
ion-cannon-heatup-multiplier=Delay between designating a target and the blast. Each step is about 3.5 seconds; the default 2 gives 7 seconds.
ion-cannon-auto-targeting=Radars with Auto-Targeting researched designate enemy nests on their own. Admins can also switch this off in the ion cannon window.
ion-cannon-target-worms=Auto-targeting also fires at worms when a scanned sector has no spawner.
ion-cannon-auto-target-visible=Fire at new enemy expansions inside the always-visible radar coverage. Beware: nests close to your buildings mean friendly fire.
ion-cannon-min-cannons-ready=Auto-targeting fires only while more than this many cannons over that planet are ready, so you always have some for manual shots.
ion-cannon-chart-tag-duration=How long the map marker of a target stays, in ticks (60 per second).
ion-cannon-cheat-menu=Show buttons that add or remove cannons for free in the ion cannon window (admins only).
ion-cannon-play-voices=Play Command & Conquer announcer lines.
ion-cannon-voice-style=CommandAndConquer: the original 1995 EVA. TiberianSunEVA and TiberianSunCABAL: the Tiberian Sun announcers.
ion-cannon-play-klaxon=Play a klaxon when a target on your surface is designated.
ion-cannon-ready-ticks=Minimum gap between two "ion cannon ready" announcements, in ticks (60 per second).
ion-cannon-custom-alerts=Show an alert for every designated target.

